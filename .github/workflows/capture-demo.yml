name: Capture demo screenshots

on:
  push:
    branches: [portfolio/demo-readme]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio/demo-readme
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          cd frontend
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start the prediction API
        run: |
          python backend/app.py > /tmp/tennis-api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/tennis-api.log
          exit 1

      - name: Capture screenshots and demo GIF
        run: |
          cd frontend
          npm run dev -- --host 127.0.0.1 > /tmp/tennis-web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173 >/dev/null; then break; fi
            sleep 2
          done
          node ../scripts/capture-demo.mjs
          video=$(find /tmp/tennis-video -name '*.webm' -print -quit)
          test -n "$video"
          ffmpeg -y -i "$video" -vf "fps=8,scale=900:-1:flags=lanczos" -loop 0 ../docs/images/tennis-demo.gif

      - name: Commit screenshots and GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/*.png docs/images/*.gif
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add screenshots and demo GIF"
          git push origin portfolio/demo-readme
