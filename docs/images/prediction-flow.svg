<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">Tennis prediction flow</title>
  <desc id="desc">Match details and historical ATP results are used to build features for a random forest model, which returns a predicted winner.</desc>
  <rect width="900" height="220" rx="12" fill="#f7f7f4"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#202522">
    <rect x="24" y="54" width="190" height="112" rx="8" fill="#ffffff" stroke="#b9c2ba" stroke-width="1.5"/>
    <text x="119" y="91" text-anchor="middle" font-size="17" font-weight="700">Match details</text>
    <text x="119" y="118" text-anchor="middle" font-size="13">Players, date, surface</text>
    <text x="119" y="138" text-anchor="middle" font-size="13">and tournament</text>
    <path d="M214 110 H250" stroke="#65776a" stroke-width="2.5" fill="none"/><path d="M243 103 L251 110 L243 117" stroke="#65776a" stroke-width="2.5" fill="none"/>
    <rect x="252" y="54" width="190" height="112" rx="8" fill="#ffffff" stroke="#b9c2ba" stroke-width="1.5"/>
    <text x="347" y="91" text-anchor="middle" font-size="17" font-weight="700">Past results</text>
    <text x="347" y="118" text-anchor="middle" font-size="13">Rankings and recent form</text>
    <text x="347" y="138" text-anchor="middle" font-size="13">from earlier matches</text>
    <path d="M442 110 H478" stroke="#65776a" stroke-width="2.5" fill="none"/><path d="M471 103 L479 110 L471 117" stroke="#65776a" stroke-width="2.5" fill="none"/>
    <rect x="480" y="54" width="174" height="112" rx="8" fill="#e4eee4" stroke="#78927c" stroke-width="1.5"/>
    <text x="567" y="91" text-anchor="middle" font-size="17" font-weight="700">Random forest</text>
    <text x="567" y="118" text-anchor="middle" font-size="13">Trained on historical</text>
    <text x="567" y="138" text-anchor="middle" font-size="13">match features</text>
    <path d="M654 110 H690" stroke="#65776a" stroke-width="2.5" fill="none"/><path d="M683 103 L691 110 L683 117" stroke="#65776a" stroke-width="2.5" fill="none"/>
    <rect x="692" y="54" width="184" height="112" rx="8" fill="#ffffff" stroke="#b9c2ba" stroke-width="1.5"/>
    <text x="784" y="91" text-anchor="middle" font-size="17" font-weight="700">Prediction</text>
    <text x="784" y="118" text-anchor="middle" font-size="13">Predicted winner</text>
    <text x="784" y="138" text-anchor="middle" font-size="13">shown in the app</text>
    <text x="450" y="199" text-anchor="middle" font-size="12" fill="#526156">Only matches before the selected match date are used for recent-form features.</text>
  </g>
</svg>